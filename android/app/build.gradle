plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // Add the Google services Gradle plugin
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// pubspec.yaml의 version이 flutter 툴에 의해 local.properties로 기록됨 — 여기서 명시적으로 읽는다
// (AGP 8.7에서는 자동 주입이 동작하지 않아 versionCode 누락 빌드 오류 발생)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace = "com.panenka.app"
    compileSdk = 36

    compileOptions {
        // flutter_local_notifications가 요구 (AGP 8.7 AAR 메타데이터 검사에서 강제됨)
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId = "com.panenka.app"
        minSdk = 23
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // key.properties가 있으면 업로드 키로 서명, 없으면 디버그 키 (개발 환경 안전장치)
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.7.0')
    
    // Firebase Messaging (FCM)
    implementation 'com.google.firebase:firebase-messaging'
}

flutter {
    source = "../.."
}
